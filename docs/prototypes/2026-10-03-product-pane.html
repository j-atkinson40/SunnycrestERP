<title>Product Pane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<style>
/* Layout: one pane, three devices. The stage holds a blurred note; the funeral home pane floats over it (desktop, iPad) or sits as a swipeable card above the sphere (phone). Single dark look, matching the note. */
:root{
  --bg:#0a0a0a;--fg:#f2f2f2;--fg-2:#9a9a9a;--fg-3:#5e5e5e;
  --rule:rgba(255,255,255,.09);--rule-2:rgba(255,255,255,.16);
  --ok:#3f9c63;--need:#e0a84a;--steel:#8aa4bd;--terra:#cc7452;
  --glass:linear-gradient(160deg,rgba(50,50,54,.6) 0%,rgba(22,22,24,.56) 55%,rgba(14,14,16,.64) 100%);
  --glass-blur:blur(26px) saturate(1.5);
  --glass-edge:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.06),inset 0 -1px 0 rgba(0,0,0,.45);
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(0.2,0,0.1,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:#050505;color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--fg-2);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* prototype controls */
.proto{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 16px;border-bottom:1px dashed var(--rule-2);font-size:12px;color:var(--fg-3);background:#050505}
.proto .g{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 10px;font-size:12px;color:var(--fg-3);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.1);color:var(--fg)}
.proto label{display:flex;align-items:center;gap:6px;cursor:pointer}
.proto input{accent-color:#d6d6d6;width:15px;height:15px}

/* stage */
.stage{position:relative;flex:1;min-height:0;width:100%;margin:0 auto;background:var(--bg);overflow:hidden;font-size:16px;line-height:1.5}
[data-mode="ipad"] .stage{max-width:1180px;font-size:18px}
[data-mode="phone"] .stage{max-width:430px}
.note{position:absolute;inset:0;padding:2.2em 2em;display:flex;flex-direction:column;gap:1.2em;max-width:44em}
.note .eb,.eb{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.note h1{margin:.2em 0 0;font-weight:300;font-size:2.4em;letter-spacing:-.02em;line-height:1.05}
.note p{margin:0;font-size:1.1em;font-weight:300;line-height:1.6}
.note dl{margin:0}.note dl div{display:flex;justify-content:space-between;padding:.7em 0;border-bottom:1px solid var(--rule)}
.note dd{margin:0;color:var(--fg-2)}
.veil{position:absolute;inset:0;background:rgba(6,6,6,.4);-webkit-backdrop-filter:blur(8px) saturate(.9);backdrop-filter:blur(8px) saturate(.9)}

/* panes */
#desk{position:absolute;inset:0;pointer-events:none}
.win{pointer-events:auto;position:absolute;width:min(27em,calc(100% - 2em));max-height:calc(100% - 8.6em);display:flex;flex-direction:column;border-radius:1.4em;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge),0 2.2em 5em rgba(0,0,0,.55),0 .6em 1.6em rgba(0,0,0,.38);transition:opacity .35s var(--ease),transform .4s var(--ease),box-shadow .25s}
.win::before{content:"";position:absolute;left:0;right:0;top:0;height:2.8em;border-radius:1.4em 1.4em 0 0;pointer-events:none;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent)}
.win.focused{box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 0 0 1px rgba(255,255,255,.1),0 2.8em 6em rgba(0,0,0,.65),0 .9em 2em rgba(0,0,0,.45)}
.win.entering{opacity:0;transform:translateY(1.2em) scale(.96)}
.win.leaving{opacity:0;transform:scale(.95)}
.win.dragging{transition:box-shadow .2s}
.wh{flex:none;display:flex;align-items:center;gap:.6em;padding:.95em .7em .3em 1.35em;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.wh .kind{flex:1;font-size:.69em;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.wh .tagp{font-size:.69em;color:var(--steel);border:1px solid rgba(138,164,189,.4);border-radius:999px;padding:.1em .6em}
.wh .x{width:2em;height:2em;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--fg-2);cursor:pointer;font-size:.95em}
.wb{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:.1em 1.35em 1.35em;display:flex;flex-direction:column;gap:.9em}

/* phone: cards in a swipe track */
.track{display:none}
[data-mode="phone"] #desk{display:none}
[data-mode="phone"] .track{position:absolute;left:0;right:0;top:.6em;bottom:7.6em;display:flex;gap:.6em;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 .6em;align-items:flex-end}
[data-mode="phone"] .track::-webkit-scrollbar{display:none}
[data-mode="phone"] .win{position:relative;flex:0 0 100%;width:auto;max-height:100%;scroll-snap-align:center;left:auto!important;top:auto!important}
[data-mode="phone"] .wh{cursor:default}
.dots{position:absolute;left:0;right:0;bottom:7em;display:none;justify-content:center;gap:.4em}
[data-mode="phone"] .dots{display:flex}
.dots i{width:.38em;height:.38em;border-radius:50%;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--fg-2)}

/* pane content */
.ttl{font-size:1.45em;font-weight:300;letter-spacing:-.012em;line-height:1.2}
.meta{font-size:.82em;color:var(--fg-2)}
.acts{display:flex;flex-wrap:wrap;gap:.5em}
.btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);border-radius:999px;padding:.5em 1em;font-size:.88em;cursor:pointer;min-height:2.6em}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--fg);color:#0a0a0a;border-color:var(--fg);font-weight:500}
.lnk{background:none;border:0;padding:.4em 0;color:var(--fg-2);font-size:.85em;cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
.sec{display:flex;flex-direction:column}
.sech{display:flex;justify-content:space-between;align-items:baseline;font-size:.69em;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);padding-bottom:.5em}
.sech span:last-child{letter-spacing:0;text-transform:none;font-size:1.15em}
.offer{display:flex;gap:.8em;align-items:flex-start;width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:.8em;padding:.65em .8em;cursor:pointer;margin-bottom:.4em}
.offer:hover{background:rgba(255,255,255,.07)}

/* ---------- device mode ---------- */

/* ---------- panes ---------- */
let panes=[],z=5,front=null;
function addPane(p){
  const ex=panes.find(w=>w.key===p.key);if(ex){focus(ex);return ex}

  const taken=panes.filter(w=>w!==p&&w.x!=null).map(w=>({l:w.x,t:w.y,r:w.x+w.el.offsetWidth,b:w.y+w.el.offsetHeight}));
  const x0=Math.max(pad,Math.min(r.width*.06,r.width-W-pad));
  for(let x=x0;x+W<=r.width-pad;x+=24)if(!taken.some(t=>x<t.r+pad&&x+W>t.l-pad)){p.x=x;p.y=pad;setXY(p);return}
  const n=panes.length;p.x=clamp(x0+n*28,pad,r.width-W-pad);p.y=pad+n*22;setXY(p);
}
function setXY(p){const r=stage.getBoundingClientRect();p.x=clamp(p.x,-p.el.offsetWidth+80,r.width-80);p.y=clamp(p.y,0,r.height-70);p.el.style.left=p.x+'px';p.el.style.top=p.y+'px'}
function focus(p){front=p;p.el.style.zIndex=++z;panes.forEach(w=>w.el.classList.toggle('focused',w===p));if(mode()==='phone')track.scrollTo({left:p.el.offsetLeft-10,behavior:'smooth'});dots()}
function closePane(p){panes=panes.filter(w=>w!==p);p.el.classList.add('leaving');setTimeout(()=>{p.el.remove();dots()},300);if(front===p){front=panes[panes.length-1]||null;if(front)focus(front)}}
function paint(p){p.el.querySelector('.kind').textContent=p.kind;p.el.querySelector('.tagp').hidden=!(state.presenting&&p.main);p.el.querySelector('.wb').innerHTML=p.render(p)}
function reveal(p,sel){
  const wb=p.el.querySelector('.wb'),t=wb.querySelector(sel);if(!t||(sel==='.tabs'&&!state.tab))return;
  requestAnimationFrame(()=>wb.scrollTo({top:t.offsetTop-wb.offsetTop-8,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
}
function repaintAll(){panes.forEach(paint)}
function dots(){$('#dots').innerHTML=panes.length>1?panes.map(p=>`<i class="${p===front?'on':''}"></i>`).join(''):''}
track.addEventListener('scroll',()=>{clearTimeout(track._t);track._t=setTimeout(()=>{const i=Math.round(track.scrollLeft/track.clientWidth);if(panes[i]){front=panes[i];dots()}},90)},{passive:true});
function wire(p){
  const el=p.el,head=el.querySelector('.wh');let d=null;
  el.addEventListener('pointerdown',()=>{if(mode()!=='phone'){front=p;el.style.zIndex=++z;panes.forEach(w=>w.el.classList.toggle('focused',w===p))}});
  head.addEventListener('pointerdown',e=>{if(mode()==='phone'||e.target.closest('button'))return;head.setPointerCapture(e.pointerId);d={sx:e.clientX,sy:e.clientY,x:p.x,y:p.y};el.classList.add('dragging')});
  head.addEventListener('pointermove',e=>{if(!d)return;p.x=d.x+e.clientX-d.sx;p.y=d.y+e.clientY-d.sy;setXY(p)});
  const end=()=>{if(d){d=null;el.classList.remove('dragging')}};
  head.addEventListener('pointerup',end);head.addEventListener('pointercancel',end);
  el.querySelector('.x').onclick=()=>closePane(p);
  el.querySelector('.wb').addEventListener('click',e=>{
    const tb=e.target.closest('.tabs button');if(tb){state.tab=state.tab===tb.dataset.tab?null:tb.dataset.tab;paint(p);reveal(p,'.tabs');return}
    const dz=e.target.closest('.disc>button');if(dz){const k=dz.dataset.k;state.open[k]=!state.open[k];paint(p);if(state.open[k])reveal(p,`.disc>button[data-k="${k}"]`);return}
    const b=e.target.closest('[data-a]');if(b)act(p,b.dataset.a,b);
  });
}



/* ---------- the catalog list pane ---------- */
function listPane(filter,title){
  const key='list:'+(title||'all');
  return {key,kind:'Products',render:()=>{
    const R=state.role,all=PRODUCTS.filter(p=>!filter||filter(p));
    let h=`<div><div class="ttl">${title||'All products'}</div><div class="meta">${all.length} products${filter?'':' · Sunnycrest catalog'}${R==='driver'?'':' · prices on the 2026 list'}</div></div>`;
    if(!filter)h+=`<div class="jump">${GROUPS.map(g=>`<button type="button" data-a="jump:${g[0]}">${g[1].replace(' vaults','').replace('Bought-in sizes','Bought-in')} <span>${PRODUCTS.filter(p=>p.g===g[0]).length}</span></button>`).join('')}</div>`;
    h+='<div>';
    GROUPS.forEach(g=>{
      const rows=all.filter(p=>p.g===g[0]);if(!rows.length)return;
      h+=`<div class="grp" data-grp="${g[0]}"><span>${g[1]}</span><span>${rows.length}</span></div>`;
      h+=rows.map(p=>{const d=detail(p);const note=d.low&&R!=='driver'&&!state.presenting?`<small class="neg">${d.stock[0]} on hand</small>`:R==='driver'?`<small>${d.wt}</small>`:'';
        return `<button type="button" class="lrow" data-a="prod:${p.id}"><span class="n">${esc(p.n)}${note}</span>${R==='driver'?'':`<span class="pr">${money(p.price)}</span>`}</button>`}).join('');
    });
    return h+'</div>';
  }};
}

/* ---------- the product pane ---------- */
function prodPane(id){
  const p=byId(id);
  return {key:'prod:'+id,kind:'Product',main:true,render:()=>{
    const d=detail(p),R=state.role,P=state.presenting,K=KNOWS[p.id]||{};
    const title=p.n+(p.g==='urn'?' urn vault':'');
    const photo=big=>`<button type="button" class="photo${big?' big':''}" data-a="photo" aria-label="Photo of ${esc(title)}"><span>Product photo</span></button>`;
    let h=`<div class="hd">${P?'':photo(false)}<div><div class="ttl">${esc(title)}</div><div class="meta">${d.kind} · ${d.made?'Produced':'Bought'}${R==='driver'||P?'':' · '+d.sku}</div></div></div>`;
    if(P)h+=photo(true);
    h+=`<div class="acts">${R==='office'?'<button class="btn primary" data-a="order">Order one</button>':''}<button class="btn" data-a="spec">Send spec sheet</button>${R!=='driver'&&!P?'<button class="btn" data-a="list">Catalog</button>':''}</div>`;
    if(R==='office'&&!P){
      const offers=[];
      if(d.low)offers.push(['neg',`${d.stock[0]} on hand, ${d.stock[2]} due out this week`,'Opens the production schedule','Opening the production schedule']);
      if(d.next)offers.push(['',`Price goes to ${money(d.next[0])} on ${d.next[1]}`,'Approved in the last price increase','Opening the price increase']);
      if(!d.made&&d.stock[0]===0)offers.push(['neg','None on hand','Bought. An order from '+d.supplier+' takes 4 days.','Starting a purchase order']);
      if(offers.length)h+=`<div class="sec"><div class="sech"><span>Right now</span></div>${offers.map(o=>`<button type="button" class="offer ${o[0]}" data-a="chip:${esc(o[3])}"><span class="dot"></span><span><div class="ot">${esc(o[1])}</div><div class="om">${esc(o[2])}</div></span><span class="go">›</span></button>`).join('')}</div>`;
    }
    if(R!=='driver')h+=`<div class="sec"><div class="sech"><span>Price</span></div><div class="line">${money(p.price)} · last changed Mar 1${d.next&&!P?` · ${money(d.next[0])} from ${d.next[1]}`:''}${!d.made&&!P?` · costs ${money(d.cost)} from ${esc(d.supplier)} · ${Math.round((1-d.cost/p.price)*100)}% margin`:''}</div></div>`;
    h+=`<div class="sec"><div class="sech"><span>Specs</span></div><div class="kv dims"><div><span>Inside</span><span>${d.inside}</span></div><div><span>Outside</span><span>${d.outside}</span></div></div><div class="line" style="padding-top:.35em">${d.wt} · ${d.lining}${R==='driver'?' · '+d.truck:''}</div></div>`;
    if(R==='office'&&!P)h+=`<div class="sec"><div class="sech"><span>Stock</span></div><div class="line">${d.low?`<span class="neg">${d.stock[0]} on hand</span>`:d.stock[0]+' on hand'} · ${d.stock[1]} in production · ${d.stock[2]} due out this week</div></div>`;
    const S=[];
    S.push(['pers','Personalization',d.pers.length||'',d.pers.length?`<div class="kv">${d.pers.map(x=>`<div><span>${x}</span><span>${x==='Legacy print'?'Panel on the cover':x==='Nameplate'?'Cover emblem':'Vinyl on the cover'}</span></div>`).join('')}</div>${PREMIUM.includes(p.id)||p.g!=='burial'?'':'<p class="meta">Sunnycrest does not offer nameplates on this vault.</p>'}`:'<p>None offered on this product. An order for it skips the personalization question.</p>']);
    if(R!=='driver'&&!P)S.push(['orders','Recent orders',4,`<div class="kv"><div><span>Sep 29</span><span>Hopkins · Lake View</span></div><div><span>Sep 24</span><span>Ferguson · St. Mary's</span></div><div><span>Sep 22</span><span>Brown & Sons · Fort Hill</span></div><div><span>Sep 18</span><span>Hopkins · St. Mary's</span></div></div>`]);
    if(R!=='driver'&&!P)S.push(['hist','Price history','',`<div class="kv">${d.next?`<div><span>${d.next[1]}, 2026</span><span>${money(d.next[0])} · pending</span></div>`:''}<div><span>Mar 1, 2026</span><span>${money(p.price)}</span></div><div><span>Mar 1, 2025</span><span>${money(Math.round(p.price*.96/5)*5)}</span></div><div><span>Mar 1, 2024</span><span>${money(Math.round(p.price*.92/5)*5)}</span></div></div>`]);
    if(R==='office'&&!P)S.push(['knows','What Opas knows','',`<div class="meta">Also called</div><div class="alias">${(K.also||['No other names yet']).map(a=>`<span>${esc(a)}</span>`).join('')}${(K.retired||[]).map(a=>`<span>${esc(a)} (retired name)</span>`).join('')}</div><div class="kv"><div><span>Usually ordered with</span><span>${K.pair||'No pattern yet'}</span></div><div><span>If it's out of stock</span><span>${K.sub||'Nothing set'}</span></div><div><span>Lead time</span><span>${K.lead||'Next day'}</span></div><div><span>Truck</span><span>${d.truck} · ${d.wt}</span></div></div><div class="acts"><button class="lnk" data-a="chip:Type the other name and Opas saves it">Add another name</button></div>`]);
    const cur=S.find(x=>x[0]===state.tab);
    h+=`<div class="sec"><div class="tabs">${S.map(x=>`<button type="button" data-tab="${x[0]}" aria-pressed="${state.tab===x[0]}">${x[1]}${x[2]?` <span>${x[2]}</span>`:''}</button>`).join('')}</div>${cur?`<div class="tabin">${cur[3]}</div>`:''}</div>`;
    if(R==='driver')h+=`<div class="foot">The office also sees price, stock and history. You see what you need to carry it.</div>`;
    if(P)h+=`<div class="foot">Presenting: cost, margin, stock and internal notes are hidden. The price stays.</div>`;
    return h;
  }};
}
function orderFor(p){
  const d=detail(p),v={vault:p.n+(p.g==='urn'?' urn vault':'')};if(!d.pers.length)v.pers='None offered';
  return {key:'neworder',kind:'New order',v,render:()=>{
    const F=[['vault','Vault'],['pers','Personalization',d.pers.length?'Offered: '+d.pers.join(', '):''],['customer','Funeral home'],['decedent','Decedent'],['service','Service'],['cemetery','Cemetery']];
    const n=F.filter(f=>v[f[0]]).length;
    return `<div class="acts" style="align-items:center"><span class="ttl" style="font-size:1.15em;margin-right:auto">New order</span><span class="pill cap">${n} captured</span><span class="pill">${F.length-n} needed</span></div>${F.map(f=>`<div class="cp${v[f[0]]?' done':''}"><span class="mk">✓</span><div><div class="k">${f[1]}</div><div class="v">${v[f[0]]?esc(v[f[0]]):f[2]||'Not mentioned yet'}</div></div></div>`).join('')}<div class="meta">The vault is filled in because you started from its record${d.pers.length?'':', and personalization is already answered because this product offers none'}.</div>`}};
}
function act(p,a){
  if(a.startsWith('prod:')){state.tab=null;addPane(prodPane(a.slice(5)));return}
  if(a.startsWith('jump:')){const wb=p.el.querySelector('.wb'),t=wb.querySelector(`[data-grp="${a.slice(5)}"]`);if(t)wb.scrollTo({top:t.offsetTop-wb.offsetTop-6,behavior:'smooth'});return}
  if(a.startsWith('chip:')){chips([a.slice(5)]);return}
  if(a==='photo'){const id=p.key.slice(5),pr=byId(id);addPane({key:'photo:'+id,kind:'Photos',render:()=>`<div><div class="ttl">${esc(pr.n)}</div><div class="meta">3 photos · the first is the one shown on the record and the spec sheet</div></div><div class="photo big" style="cursor:default"><span>Product photo 1</span></div><div class="thumbs"><div class="photo"><span>1</span></div><div class="photo"><span>2</span></div><div class="photo"><span>3</span></div></div>${state.role==='office'&&!state.presenting?'<div class="acts"><button class="btn" data-a="chip:Choose a photo or take one">Add a photo</button></div>':''}`});return}
  if(a==='list'){addPane(listPane());return}
  if(a==='spec'){chips(['Spec sheet ready. Who should it go to?']);return}
  if(a==='order'){const id=p.key.slice(5);addPane(orderFor(byId(id)));chips(['Started an order with this vault']);return}
}

/* ---------- the bar: names, other names, and asking which one ---------- */
const ALIAS={'rough box':'graveliner','liner':'graveliner','pine box':'graveliner','sst':'sst','stainless':'sst','monti':'monticello'};
let chipT,pending=null;
function chips(list){$('#chips').innerHTML=list.map(t=>`<span class="chip">${esc(t)}</span>`).join('');clearTimeout(chipT);chipT=setTimeout(()=>$('#chips').innerHTML='',4600)}
function ask(list,why){
  pending=list;const el=$('#pick');
  el.innerHTML=`<span class="ph">${esc(why)}</span>`+list.map((p,i)=>`<button type="button" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(p.n)}${p.g==='urn'?' urn vault':''} <small>· ${GROUPS.find(g=>g[0]===p.g)[1].toLowerCase()} · ${money(p.price)}</small></span></button>`).join('');
  el.classList.add('on');
}
function choose(i){if(!pending||!pending[i])return;const p=pending[i];pending=null;$('#pick').classList.remove('on');state.tab=null;addPane(prodPane(p.id))}
$('#pick').onclick=e=>{const b=e.target.closest('button');if(b)choose(+b.dataset.i)};
function run(raw){
  const s=raw.toLowerCase().replace(/^(pull up|open|show me|show|find)\s+/,'').replace(/^(the|a|our)\s+/,'').trim();if(!s)return;
  pending=null;$('#pick').classList.remove('on');
  if(/^(catalog|all (our )?products|everything|products)$/.test(s)){addPane(listPane());return}
  if(/oversize|large/.test(s)){addPane(listPane(p=>['mont34','lg34','lg36','lg40'].includes(p.id),'Oversize vaults'));return}
  if(/^urn/.test(s)){addPane(listPane(p=>p.g==='urn','Urn vaults'));return}
  if(/price list/.test(s)){chips(['Opens the current price list document']);return}
  if(/^close/.test(s)){if(front)closePane(front);return}
  for(const k in ALIAS)if(s===k||s.includes(k)){state.tab=null;addPane(prodPane(ALIAS[k]));chips([`"${k}" = ${byId(ALIAS[k]).n}`+(k==='pine box'?' (retired name)':'')]);return}
  if(s==='bronze'){ask([byId('wbronze'),byId('btriune'),byId('u-btriune')],'"The bronze" could be three things. Which one?');return}
  const words=s.split(/\s+/);const hits=PRODUCTS.filter(p=>words.every(w=>p.n.toLowerCase().includes(w)));
  const exact=hits.filter(p=>p.n.toLowerCase()===s&&p.g!=='urn');
  if(hits.length===1||(exact.length===1&&hits.length===1)){state.tab=null;addPane(prodPane(hits[0].id));return}
  if(hits.length>1){ask(hits.slice(0,5),`${hits.length} products match "${raw.trim()}". Which one?`);return}
  chips([`Nothing called "${raw.trim()}". Say what it is and Opas can save the name.`]);
}
$('#cmd').addEventListener('keydown',e=>{
  if(pending&&/^[1-9]$/.test(e.key)&&!e.target.value){e.preventDefault();choose(+e.key-1);return}
  if(e.key==='Enter'){e.preventDefault();const v=e.target.value;e.target.value='';run(v)}
});
$('#orb').onclick=()=>{const b=$('#bar');b.classList.toggle('hide');if(!b.classList.contains('hide'))$('#cmd').focus()};

syncRole();syncDen();applyMode();
addPane(listPane());addPane(prodPane('venetian'));
})();
</script>
