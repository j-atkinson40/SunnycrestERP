<title>Sales Order Pane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Serif:wght@400&display=swap">
<style>
/* Layout: one pane, three devices. The stage holds a blurred note; the funeral home pane floats over it (desktop, iPad) or sits as a swipeable card above the sphere (phone). Single dark look, matching the note. */
:root{
  --bg:#0a0a0a;--fg:#f2f2f2;--fg-2:#9a9a9a;--fg-3:#5e5e5e;
  --rule:rgba(255,255,255,.09);--rule-2:rgba(255,255,255,.16);
  --ok:#3f9c63;--need:#e0a84a;--steel:#8aa4bd;--terra:#cc7452;
  --glass:linear-gradient(160deg,rgba(50,50,54,.6) 0%,rgba(22,22,24,.56) 55%,rgba(14,14,16,.64) 100%);
  --glass-blur:blur(26px) saturate(1.5);
  --glass-edge:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.06),inset 0 -1px 0 rgba(0,0,0,.45);
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(0.2,0,0.1,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:#050505;color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--fg-2);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* prototype controls */
.proto{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 16px;border-bottom:1px dashed var(--rule-2);font-size:12px;color:var(--fg-3);background:#050505}
.proto .g{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 10px;font-size:12px;color:var(--fg-3);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.1);color:var(--fg)}
.proto label{display:flex;align-items:center;gap:6px;cursor:pointer}
.proto input{accent-color:#d6d6d6;width:15px;height:15px}

/* stage */
.stage{position:relative;flex:1;min-height:0;width:100%;margin:0 auto;background:var(--bg);overflow:hidden;font-size:16px;line-height:1.5}
[data-mode="ipad"] .stage{max-width:1180px;font-size:18px}
[data-mode="phone"] .stage{max-width:430px}
.note{position:absolute;inset:0;padding:2.2em 2em;display:flex;flex-direction:column;gap:1.2em;max-width:44em}
.note .eb,.eb{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.note h1{margin:.2em 0 0;font-weight:300;font-size:2.4em;letter-spacing:-.02em;line-height:1.05}
.note p{margin:0;font-size:1.1em;font-weight:300;line-height:1.6}
.note dl{margin:0}.note dl div{display:flex;justify-content:space-between;padding:.7em 0;border-bottom:1px solid var(--rule)}
.note dd{margin:0;color:var(--fg-2)}
.veil{position:absolute;inset:0;background:rgba(6,6,6,.4);-webkit-backdrop-filter:blur(8px) saturate(.9);backdrop-filter:blur(8px) saturate(.9)}

/* panes */
#desk{position:absolute;inset:0;pointer-events:none}
.win{pointer-events:auto;position:absolute;width:min(27em,calc(100% - 2em));max-height:calc(100% - 8.6em);display:flex;flex-direction:column;border-radius:1.4em;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge),0 2.2em 5em rgba(0,0,0,.55),0 .6em 1.6em rgba(0,0,0,.38);transition:opacity .35s var(--ease),transform .4s var(--ease),box-shadow .25s}
.win::before{content:"";position:absolute;left:0;right:0;top:0;height:2.8em;border-radius:1.4em 1.4em 0 0;pointer-events:none;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent)}
.win.focused{box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 0 0 1px rgba(255,255,255,.1),0 2.8em 6em rgba(0,0,0,.65),0 .9em 2em rgba(0,0,0,.45)}
.win.entering{opacity:0;transform:translateY(1.2em) scale(.96)}
.win.leaving{opacity:0;transform:scale(.95)}
.win.dragging{transition:box-shadow .2s}
.wh{flex:none;display:flex;align-items:center;gap:.6em;padding:.95em .7em .3em 1.35em;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.wh .kind{flex:1;font-size:.69em;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.wh .tagp{font-size:.69em;color:var(--steel);border:1px solid rgba(138,164,189,.4);border-radius:999px;padding:.1em .6em}
.wh .x{width:2em;height:2em;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--fg-2);cursor:pointer;font-size:.95em}
.wb{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:.1em 1.35em 1.35em;display:flex;flex-direction:column;gap:.9em}

/* phone: cards in a swipe track */
.track{display:none}
[data-mode="phone"] #desk{display:none}
[data-mode="phone"] .track{position:absolute;left:0;right:0;top:.6em;bottom:7.6em;display:flex;gap:.6em;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 .6em;align-items:flex-end}
[data-mode="phone"] .track::-webkit-scrollbar{display:none}
[data-mode="phone"] .win{position:relative;flex:0 0 100%;width:auto;max-height:100%;scroll-snap-align:center;left:auto!important;top:auto!important}
[data-mode="phone"] .wh{cursor:default}
.dots{position:absolute;left:0;right:0;bottom:7em;display:none;justify-content:center;gap:.4em}
[data-mode="phone"] .dots{display:flex}
.dots i{width:.38em;height:.38em;border-radius:50%;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--fg-2)}

/* pane content */
.ttl{font-size:1.45em;font-weight:300;letter-spacing:-.012em;line-height:1.2}
.meta{font-size:.82em;color:var(--fg-2)}

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.min(Math.max(v,a),Math.max(a,b));
const stage=$('#stage'),desk=$('#desk'),track=$('#track');
const money=n=>'$'+n.toLocaleString('en-US');
const state={mode:'auto',role:'office',presenting:false,resolved:{},open:{},density:'compact',tab:null};

/* ---------- the sample order (placeholder prices) ---------- */
const O={id:'SO-2026-0412',dec:'John R. Albright',fh:'Hopkins Funeral Home',contact:'Ruth Hopkins',vault:'Monticello',pers:'Legacy print · American Flag',
  cem:"St. Mary's Cemetery",town:'Skaneateles',plot:'Section C, Lot 14',time:'9:00',reviewed:false,draft:'',driver:'Dave',truck:'Truck 3',
  equip:'Full setup · tent, 12 chairs, lowering device',proof:'back',spelling:'John',
  lines:[['Monticello',1405],['Legacy print',185],['Full setup',225]]};
const HIST=[
  ['Today 9:12','Ruth emailed: can the service move to 10:00, graveside?','Opas matched the email to this order'],
  ['Today 8:40','Legacy change requested: the family wants "Jon"','Ruth Hopkins, from the proof link'],
  ['Wed 3:15','Dave assigned, Truck 3','Karen'],
  ['Wed 2:05','Proof sent to Ruth','Opas, on behalf of Karen'],
  ['Wed 1:50','Order created from a call with Ruth','Opas, on behalf of Karen · approved by Karen']
];
const log=(t,who)=>HIST.unshift(['Just now',t,who]);
const total=()=>O.lines.reduce((a,l)=>a+l[1],0);
const late=()=>!O.reviewed; // the service time changed after this was scheduled and nobody has looked yet

/* ---------- device mode ---------- */
function autoMode(){return innerWidth<640?'phone':matchMedia('(pointer:coarse)').matches?'ipad':'desktop'}
function mode(){return state.mode==='auto'?autoMode():state.mode}
function applyMode(){
  document.documentElement.dataset.mode=mode();
  [...$('#segMode').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===state.mode));
  $('#bar').classList.toggle('hide',mode()!=='desktop');
  remount();
}
const h=(location.hash||'').slice(1);if(['desktop','ipad','phone'].includes(h))state.mode=h;
$('#segMode').onclick=e=>{const b=e.target.closest('button');if(b){state.mode=b.dataset.v;applyMode()}};
$('#segRole').onclick=e=>{const b=e.target.closest('button');if(b){state.role=b.dataset.v;syncRole();repaintAll()}};
function syncRole(){[...$('#segRole').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===state.role))}
function syncDen(){document.documentElement.dataset.density=state.density;[...$('#segDen').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===state.density))}
$('#segDen').onclick=e=>{const b=e.target.closest('button');if(b){state.density=b.dataset.v;syncDen();repaintAll()}};
$('#presenting').onchange=e=>{state.presenting=e.target.checked;repaintAll()};
addEventListener('resize',()=>{if(state.mode==='auto'&&document.documentElement.dataset.mode!==autoMode())applyMode();else panes.forEach(p=>{if(p.x!=null)setXY(p)})});

/* ---------- panes ---------- */
let panes=[],z=5,front=null;
function addPane(p){
  const ex=panes.find(w=>w.key===p.key);if(ex){focus(ex);return ex}
  const el=document.createElement('article');el.className='win entering';
  el.innerHTML=`<div class="wh"><span class="kind"></span><span class="tagp" hidden>Presenting</span><button class="x" type="button" aria-label="Close">×</button></div><div class="wb"></div>`;
  p.el=el;panes.push(p);mount(p);paint(p);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('entering')));
  wire(p);focus(p);return p;
}
function mount(p){
  if(mode()==='phone'){track.appendChild(p.el);p.x=p.y=null}
  else{desk.appendChild(p.el);if(p.x==null)place(p);else setXY(p)}
}
function remount(){panes.forEach(p=>{p.x=p.y=null;p.el.remove()});panes.forEach(p=>{mount(p)});if(front)focus(front);dots()}
function place(p){
  const r=stage.getBoundingClientRect(),W=p.el.offsetWidth||430,H=p.el.offsetHeight||400,pad=16,bottom=r.height-120;
  const taken=panes.filter(w=>w!==p&&w.x!=null).map(w=>({l:w.x,t:w.y,r:w.x+w.el.offsetWidth,b:w.y+w.el.offsetHeight}));
  const x0=Math.max(pad,Math.min(r.width*.06,r.width-W-pad));
  for(let x=x0;x+W<=r.width-pad;x+=24)if(!taken.some(t=>x<t.r+pad&&x+W>t.l-pad)){p.x=x;p.y=pad;setXY(p);return}
  const n=panes.length;p.x=clamp(x0+n*28,pad,r.width-W-pad);p.y=pad+n*22;setXY(p);
}
function setXY(p){const r=stage.getBoundingClientRect();p.x=clamp(p.x,-p.el.offsetWidth+80,r.width-80);p.y=clamp(p.y,0,r.height-70);p.el.style.left=p.x+'px';p.el.style.top=p.y+'px'}
function focus(p){front=p;p.el.style.zIndex=++z;panes.forEach(w=>w.el.classList.toggle('focused',w===p));if(mode()==='phone')track.scrollTo({left:p.el.offsetLeft-10,behavior:'smooth'});dots()}
function closePane(p){panes=panes.filter(w=>w!==p);p.el.classList.add('leaving');setTimeout(()=>{p.el.remove();dots()},300);if(front===p){front=panes[panes.length-1]||null;if(front)focus(front)}}
function paint(p){p.el.querySelector('.kind').textContent=p.kind;p.el.querySelector('.tagp').hidden=!(state.presenting&&p.main);p.el.querySelector('.wb').innerHTML=p.render(p)}
function reveal(p,sel){
  const wb=p.el.querySelector('.wb'),t=wb.querySelector(sel);if(!t||(sel==='.tabs'&&!state.tab))return;
  requestAnimationFrame(()=>wb.scrollTo({top:t.offsetTop-wb.offsetTop-8,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
}
function repaintAll(){panes.forEach(paint)}
function dots(){$('#dots').innerHTML=panes.length>1?panes.map(p=>`<i class="${p===front?'on':''}"></i>`).join(''):''}
track.addEventListener('scroll',()=>{clearTimeout(track._t);track._t=setTimeout(()=>{const i=Math.round(track.scrollLeft/track.clientWidth);if(panes[i]){front=panes[i];dots()}},90)},{passive:true});
function wire(p){
  const el=p.el,head=el.querySelector('.wh');let d=null;
  el.addEventListener('pointerdown',()=>{if(mode()!=='phone'){front=p;el.style.zIndex=++z;panes.forEach(w=>w.el.classList.toggle('focused',w===p))}});
  head.addEventListener('pointerdown',e=>{if(mode()==='phone'||e.target.closest('button'))return;head.setPointerCapture(e.pointerId);d={sx:e.clientX,sy:e.clientY,x:p.x,y:p.y};el.classList.add('dragging')});
  head.addEventListener('pointermove',e=>{if(!d)return;p.x=d.x+e.clientX-d.sx;p.y=d.y+e.clientY-d.sy;setXY(p)});
  const end=()=>{if(d){d=null;el.classList.remove('dragging')}};
  head.addEventListener('pointerup',end);head.addEventListener('pointercancel',end);
  el.querySelector('.x').onclick=()=>closePane(p);
  el.querySelector('.wb').addEventListener('click',e=>{
    const tb=e.target.closest('.tabs button');if(tb){state.tab=state.tab===tb.dataset.tab?null:tb.dataset.tab;paint(p);reveal(p,'.tabs');return}
    const dz=e.target.closest('.disc>button');if(dz){const k=dz.dataset.k;state.open[k]=!state.open[k];paint(p);if(state.open[k])reveal(p,`.disc>button[data-k="${k}"]`);return}
    const b=e.target.closest('[data-a]');if(b)act(p,b.dataset.a,b);
  });
}



/* ---------- the sales order pane ---------- */
function steps(){
  const s=[['Proof',O.proof==='approved'?'done':'bad'],['Scheduled',late()||!O.driver?'bad':'done'],['Delivered',''],['Invoiced','']];
  return `<div class="steps" role="img" aria-label="Order progress">${s.map((x,i)=>(i?'<i></i>':'')+`<span class="${x[1]}">${x[0]}</span>`).join('')}</div>`;
}
function orderPane(){
  return {key:'so',kind:'Sales order',main:true,render:()=>{
    const R=state.role,P=state.presenting;
    let h=`<div><div class="ttl dec">${esc(O.dec)}</div><div class="meta">${O.id} · <button type="button" class="lnk" data-a="fh">${O.fh}</button></div></div>`;
    h+=`<div class="acts">${R==='office'?`<button class="btn${late()?' primary':''}" data-a="resched">Open scheduling</button><button class="btn" data-a="contact">Contact</button>${P?'':'<button class="btn" data-a="edit">Edit</button>'}`
      :R==='driver'?'<button class="btn primary" data-a="chip:Directions to St. Mary\'s, service road gate">Directions</button><button class="btn" data-a="contact">Contact</button><button class="btn" data-a="chip:Close-out opens when you are at the cemetery">Close out</button>'
      :'<button class="btn" data-a="contact">Contact</button><button class="btn" data-a="chip:Invoiced at month end with the October statement">Invoice</button>'}</div>`;
    if(!P){
      const offers=[];
      if(late())offers.push(['neg','Asked to move to 10:00 graveside',R==='driver'?'Office is checking':R==='office'?'From Ruth · check the route':'From Ruth, not answered',R==='driver'?'chip:The office has been told':'resched']);
      if(!O.driver)offers.push(['neg','No driver assigned','Opens scheduling',R==='office'?'resched':'chip:The office has been told']);
      if(O.proof==='back'&&R!=='accounting')offers.push(['','Legacy change requested',R==='driver'?'Print is not final yet':'Family wants "Jon"','proof']);
      if(offers.length)h+=`<div class="sec"><div class="sech"><span>Right now</span><span>${offers.length} open</span></div>${offers.map(o=>`<button type="button" class="offer ${o[0]}" data-a="${esc(o[3])}"><span class="dot"></span><span><div class="ot">${esc(o[1])}</div><div class="om">${esc(o[2])}</div></span><span class="go">›</span></button>`).join('')}</div>`;
    }
    if(R!=='driver')h+=`<div class="sec"><div class="sech"><span>Status</span></div>${steps()}</div>`;
    h+=`<div class="sec"><div class="sech"><span>The order</span></div><div class="kv">
      <div><span>Vault</span><span><button type="button" class="lnk" data-a="prod">${O.vault}</button></span></div>
      <div><span>Personalization</span><span><button type="button" class="lnk" data-a="proof">${O.pers}</button>${O.proof==='approved'?'':P?'':' · <span class="neg">proof not final</span>'}</span></div>
      <div><span>Cemetery</span><span><button type="button" class="lnk" data-a="cem">${O.cem}, ${O.town}</button> · ${O.plot}</span></div>
      <div><span>Service</span><span>Fri Oct 2 · ${O.time} AM graveside${late()&&!P?' · <span class="neg">10:00 requested</span>':''}</span></div>
      <div><span>Delivery</span><span>${P?'Scheduled':R==='driver'?'Stop 1 of 4':(O.driver||'<span class="neg">No driver</span>')+' · '+O.truck+' · stop 1 of 4'}</span></div>
      <div><span>Equipment</span><span>${O.equip}</span></div>
      ${R!=='driver'?`<div><span>Total</span><span>${money(total())}</span></div>`:''}</div></div>`;
    const S=[];
    const deliv=`<div class="kv"><div><span>Driver</span><span>${O.driver||'Unassigned'} · ${O.truck}</span></div><div><span>Route</span><span>Stop 1 of 4 on Friday</span></div><div><span>Gate</span><span>Service road, not the main lane</span></div><div><span>Setup photo</span><span>Required before the family arrives</span></div></div>`;
    S.push(['deliv',R==='driver'?'Your stop':'Delivery','',deliv]);
    S.push(['proof','Proof','',`<p>${O.proof==='approved'?'Approved. Printing as "'+O.spelling+' R. Albright."':O.proof==='revised'?'Revision requested: "Jon R. Albright." Waiting on the print queue.':'Change requested today. The family wants "Jon," not "John."'}</p>${R==='office'&&O.proof==='back'?'<div class="acts"><button class="lnk" data-a="proof">Open the proof</button></div>':''}`]);
    if(R!=='driver')S.push(['bill','Billing','',`<div>${O.lines.map(l=>`<div class="sum"><span>${l[0]}</span><span>${money(l[1])}</span></div>`).join('')}<div class="sum tot"><span>Total</span><span>${money(total())}</span></div></div>${P?'':`<p class="meta">Not invoiced yet. It goes out at month end with the October statement. Hopkins is Net 30${R==='accounting'?' and has $1,590 past due':''}.</p>`}`]);
    if(R!=='driver'&&!P)S.push(['hist','History',HIST.length,`<div class="hist">${HIST.map(x=>`<time>${x[0]}</time><span>${esc(x[1])}<br><small>${esc(x[2])}</small></span>`).join('')}</div>`]);
    if(R==='office'&&!P)S.push(['notes','Notes','',`<p>Ruth wants the setup photo before the family leaves the church.</p><p class="meta">Internal. Never shown when presenting, never on the invoice.</p>`]);
    const cur=S.find(x=>x[0]===state.tab);
    h+=`<div class="sec"><div class="tabs">${S.map(x=>`<button type="button" data-tab="${x[0]}" aria-pressed="${state.tab===x[0]}">${x[1]}${x[2]?` <span>${x[2]}</span>`:''}</button>`).join('')}</div>${cur?`<div class="tabin">${cur[3]}</div>`:''}</div>`;
    if(R==='driver')h+=`<div class="foot">The office also sees price, billing and history. You see what you need for the stop.</div>`;
    if(P)h+=`<div class="foot">Presenting: anything waiting, the driver, history and internal notes are hidden. The order and its total stay.</div>`;
    return h;
  }};
}

/* ---------- what the order opens ---------- */
const SUB={
  proof:()=>({key:'proof',kind:'Legacy proof',render:()=>`<div><div class="ttl">Albright · Legacy print</div><div class="meta">American Flag · change requested today</div></div><div class="proof"><span>${O.spelling} R. Albright</span></div><div class="meta">The family wants "Jon," not "John."</div>${state.role==='office'?'<div class="acts"><button class="btn primary" data-a="revise">Request the change</button><button class="btn" data-a="approveproof">Approve as is</button></div>':'<div class="meta">The office decides on the proof.</div>'}`}),
  contact:()=>({key:'contact',kind:'Contact',render:()=>{
    const W=[['email','Email Ruth','ruth@hopkinsfh.com'],['text','Text Ruth','(315) 555-0118'],['call','Call Ruth','Mobile · (315) 555-0118'],['callfh','Call the funeral home','Main line · (315) 555-0100'],['texttom','Text Sam Hopkins','Funeral director · (315) 555-0121']];
    const first=state.role==='driver'?'call':'email';W.sort((a,b)=>(b[0]===first)-(a[0]===first));
    return `<div><div class="ttl">${O.fh}</div><div class="meta">About ${O.dec} · ${O.id}</div></div><div class="sec">${W.map((w,i)=>`<button type="button" class="row" data-a="via:${w[0]}"><span class="a">${w[1]}</span><span class="b">${i?w[2]:state.role==='driver'?'Fastest from the truck':'Most likely · she emailed about this order today'}</span><span class="c">›</span></button>`).join('')}</div>`}}),
  msg:(k)=>({key:'msg:'+k,kind:k==='email'?'Email':'Text',render:()=>`<div><div class="ttl">To ${k==='texttom'?'Sam':'Ruth'} Hopkins</div><div class="meta">About ${O.dec} · ${O.id}</div></div><label class="sr" for="tx">Message</label><textarea id="tx">${esc(O.draft||'Hi Ruth, a quick update on the Albright order: ')}</textarea><div class="acts"><button class="btn primary" data-a="sendmsg">Send</button><button class="lnk" data-a="closeme">Not now</button></div>`}),
  prod:()=>({key:'prod',kind:'Product',render:()=>`<div><div class="ttl">Monticello</div><div class="meta">Burial vault · Produced</div></div><div class="kv"><div><span>Inside</span><span>86″ L × 30″ W × 24″ H</span></div><div><span>Outside</span><span>90″ L × 34″ W × 30″ H</span></div><div><span>Weight</span><span>2,450 lb · Strentex-lined</span></div></div><div class="meta">This is the product pane, shortened here. Opened from the order, it knows which order you came from.</div>`}),
  cem:()=>({key:'cem',kind:'Cemetery',render:()=>`<div><div class="ttl">${O.cem}</div><div class="meta">${O.town}, NY · not the St. Mary's in Auburn</div></div><div class="kv"><div><span>Gate</span><span>Service road, not the main lane</span></div><div><span>Sexton</span><span>Paul Rinaldi</span></div><div><span>Equipment</span><span>Lowering device allowed · no tent stakes in Section A</span></div></div><div class="meta">This is the cemetery pane, shortened here.</div>`}),
  fh:()=>({key:'fh',kind:'Customer',render:()=>`<div><div class="ttl">${O.fh}</div><div class="meta">Funeral home · Ruth Hopkins, director</div></div><div class="meta">This is the customer pane, shortened here.</div>`})
};
function done(msg,p){if(p)closePane(p);chips([msg]);const m=panes.find(w=>w.main);if(m){paint(m);focus(m)}}
/* ---------- stand-in for the scheduling Focus ---------- */
const SCHED={Dave:[['11:30','Whitfield','Lake View, Auburn · graveside'],['2:00','Brown','Fort Hill, Auburn · church · ETA 3:00'],['—','Keller','Oakwood, Syracuse · no service']],Mike:[['10:30','Ferris','Oakwood, Syracuse · graveside'],['2:30','Dunn','Lake View, Skaneateles · church · ETA 3:15']]};
const T={Dave:'Truck 3',Mike:'Truck 1'};
const hr=t=>{if(t==='—')return 99;const [h,m]=t.split(':').map(Number);return (h<7?h+12:h)+m/60};
let F=null,before=null;
function openFocus(){
  if(state.role!=='office'){chips(['Only the office can change the schedule']);return}
  before=O.time+O.driver;F=document.createElement('div');F.className='focus';stage.appendChild(F);stage.classList.add('infocus');paintFocus();
}
function paintFocus(){
  F.innerHTML=`<div><div class="eb">Scheduling Focus · shortened here · <a href="https://claude.ai/artifact/Pp2DcfhTTm2A1zK62X3EeR" target="_blank" rel="noopener" style="color:inherit">open the full prototype</a></div><h2>Friday, October 2</h2></div>
  <div class="lanes">${['Dave','Mike'].map(d=>{
    const rows=SCHED[d].map(x=>({t:x[0],h:`<div class="stop"><time>${x[0]}</time><span>${x[1]}<small>${x[2]}</small></span></div>`}));
    if(O.driver===d)rows.push({t:O.time,h:`<div class="stop sel"><time>${O.time}</time><span>Albright<small>St. Mary's, Skaneateles · graveside${late()?' · <span class="neg">Ruth asked for 10:00</span>':''}</small><div class="acts">${late()?'<button class="btn primary" data-f="keep">Move to 10:00</button>':''}<button class="btn" data-f="swap">Give to ${d==='Dave'?'Mike':'Dave'}</button></div></span></div>`});
    rows.sort((a,b)=>hr(a.t)-hr(b.t));
    return `<div class="lane"><h3>${d} · ${T[d]}</h3>${rows.map(x=>x.h).join('')}</div>`}).join('')}</div>
  <div class="meta">In the full Focus this is the driver board, with the Albright card outlined and the request on it. The sphere is tucked away while a Focus is open.</div>
  <div class="acts"><button class="btn primary" data-f="done">Done</button></div>`;
}
stage.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;const a=b.dataset.f;
  if(a==='keep'){O.reviewed=true;O.time='10:00';paintFocus()}
  if(a==='swap'){O.driver=O.driver==='Dave'?'Mike':'Dave';O.truck=T[O.driver];paintFocus()}
  if(a==='done'){F.remove();F=null;stage.classList.remove('infocus');if(before!==O.time+O.driver){log(O.time==='10:00'?`Service moved to 10:00 graveside at Ruth's request · ${O.driver}, ${O.truck}`:`Given to ${O.driver}, ${O.truck}`,'Karen, in the scheduling Focus');if(O.time==='10:00'){O.draft=`Yes, 10:00 graveside works. ${O.driver} will be there.`;done('Moved to 10:00. Reply to Ruth is drafted.');addPane(SUB.msg('email'))}else done('Schedule updated')}}
});
function act(p,a){
  if(a.startsWith('chip:')){chips([a.slice(5)]);return}
  if(a==='resched'){openFocus();return}
  if(a.startsWith('via:')){const k=a.slice(4);closePane(p);if(/call/.test(k))chips([k==='call'?'Calling Ruth Hopkins':'Calling Hopkins Funeral Home']);else addPane(SUB.msg(k));return}
  if(SUB[a]){addPane(SUB[a]());return}
  if(a==='edit'){chips(['Say what to change: "make it a Venetian", "add a nameplate"']);return}
  if(a==='closeme'){closePane(p);return}
  if(a==='revise'){O.proof='revised';O.spelling='Jon';log('Proof revision requested: "Jon"','Karen');return done('Revision sent to the print queue. Ruth is told.',p)}
  if(a==='approveproof'){O.proof='approved';log('Proof approved as "John"','Karen');return done('Proof approved',p)}
  if(a==='sendmsg')return done('Sent',p);
}

/* ---------- the bar ---------- */
let chipT;function chips(list){$('#chips').innerHTML=list.map(t=>`<span class="chip">${esc(t)}</span>`).join('');clearTimeout(chipT);chipT=setTimeout(()=>$('#chips').innerHTML='',4600)}
function tab(t){const m=addPane(orderPane());state.tab=t;paint(m);reveal(m,'.tabs')}
function run(raw){
  const s=raw.toLowerCase().trim();if(!s)return;const office=state.role==='office';
  if(/move it|earlier|later|mike|dave|resched|schedul|route|assign/.test(s)){openFocus();return}
  if(/proof/.test(s)){addPane(SUB.proof());return}
  if(/email/.test(s)){addPane(SUB.msg('email'));return}
  if(/text|tell ruth/.test(s)){addPane(SUB.msg('text'));return}
  if(/contact|message|call|reach/.test(s)){addPane(SUB.contact());return}
  if(/bill|invoice|total|price/.test(s)){if(state.role==='driver'){chips(["That's not available to drivers"]);return}tab('bill');return}
  if(/history|who changed/.test(s)){if(!office||state.presenting){chips(['History is office only']);return}tab('hist');return}
  if(/monticello|vault|product/.test(s)){addPane(SUB.prod());return}
  if(/cemetery|st\.? mary/.test(s)){addPane(SUB.cem());return}
  if(/hopkins|funeral home/.test(s)){addPane(SUB.fh());return}
  if(/albright|order|0412/.test(s)){addPane(orderPane());return}
  if(/^close/.test(s)){if(front)closePane(front);return}
  chips(['Try: the proof · the schedule · billing · history']);
}
$('#cmd').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value;e.target.value='';run(v)}});
$('#orb').onclick=()=>{const b=$('#bar');b.classList.toggle('hide');if(!b.classList.contains('hide'))$('#cmd').focus()};

syncRole();syncDen();applyMode();
addPane(orderPane());
})();
</script>
