# Railway config-as-code for the API service. Values here override the dashboard,
# so this file is the record of WHY each one is set.
#
# ⚠️ WHY THIS FILE EXISTS: EVERY DEPLOY TOOK PRODUCTION OFFLINE FOR MINUTES.
# Measured 2026-10-23 across two deploys of this service: a 502 window of AT LEAST
# 329 seconds on one and roughly nine minutes on another. Railway was routing
# api.getbridgeable.com at the new container the moment it started, and
# `railway-start.sh` does not bind a port until it has run `alembic upgrade head`
# plus every canonical seed. Until then there is nothing listening, and the old
# container had already been removed — so the gap is a hard outage, not a slow page.
#
# With `healthcheckPath` set, Railway holds traffic on the PREVIOUS deployment until
# the new one answers, then switches. The boot stays just as slow; the downtime goes
# to zero. That is the trade James asked for on 2026-10-23.
#
# ⚠️ THE ROOT CAUSE IS THE SEEDS IN THE BOOT PATH AND THIS DOES NOT FIX IT. It makes
# the slowness invisible to users, which is worth having and is also exactly how a
# nine-minute boot stops being anybody's problem until it hits a timeout. The
# proposal for moving seeds to `preDeployCommand` is in the report; it is not applied
# here, because James rules on seed behaviour.

[deploy]
# Public, unauthenticated, and it already reports what the gate needs — the running
# commit and whether the database answered. Nothing else is suitable: every other
# route needs a JWT, and a healthcheck that 401s never goes healthy.
healthcheckPath = "/api/health"

# ⚠️ GENEROUS ON PURPOSE, AND THE NUMBER IS MEASURED RATHER THAN ROUND. Boot has been
# observed at 330s and at ~540s. Railway FAILS a deploy whose healthcheck does not
# pass inside this window, so a timeout near the observed boot time would convert
# today's silent outage into a red deploy — a different failure, not a fix. 900s is
# ~1.7x the slowest boot seen. It costs nothing on a fast boot: the check passes as
# soon as uvicorn binds and the switch happens then.
#
# ⚠️ IF THE SEEDS LEAVE THE BOOT PATH, BRING THIS DOWN. A 15-minute tolerance for a
# service that should bind in seconds is a place for a real hang to hide.
healthcheckTimeout = 900
