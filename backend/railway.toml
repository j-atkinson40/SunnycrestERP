# Railway config-as-code for the API service. Values here override the dashboard,
# so this file is the record of WHY each one is set.
#
# ⚠️ POSITIVE CONTROL FOR THIS FILE, because "Railway read it" and "Railway ignored it
# and the dashboard happened to agree" look identical from outside. The deployment
# object echoes both the path it read and which keys came from it:
#
#     meta.configFile              /backend/railway.toml
#     meta.propertyFileMapping     one entry per key taken from the file
#
# Asserted by tests/test_deploy_config.py against the live deployment when the CLI is
# available. Do not take a working deploy as evidence the file applied.

[deploy]
# ── the seeds are not in the serving path ────────────────────────────────────
#
# ⚠️ WHY A PRE-DEPLOY AND NOT A BACKGROUND TASK. Railway fails the whole deploy when
# this exits non-zero, which is the R-1.6.3 (seeds) and R-3.1.3 (migrations) contract
# exactly: red dashboard, and the next deploy must repair the seed. A thread started
# after the server came up would have made every one of those failures quiet, and
# CLAUDE.md §11 names converting a loud failure into a quiet one as a regression in
# its own right even when the change is otherwise an improvement.
preDeployCommand = "bash railway-prep.sh"

# ⚠️ MEASURED, NOT ROUND. Prep took 537 s and 552 s on the two deploys of 2026-10-23,
# both while it was still the container's startup. 1800 s is ~3.3x the slower of the
# two, which leaves room for the seed set to grow before anyone has to think about this
# number again. Railway's ceiling for this field is 3600.
preDeployTimeoutSeconds = 1800

# ── the healthcheck ──────────────────────────────────────────────────────────
#
# Public, unauthenticated, and it already reports what is needed — the running commit
# and whether the database answered. Nothing else is suitable: every other route needs
# a JWT, and a healthcheck that 401s never goes healthy.
healthcheckPath = "/api/health"

# ⚠️ WAS 900, AND BRINGING IT DOWN IS THE POINT OF THE CHANGE ABOVE. 900 s was ~1.7x a
# measured nine-minute boot — correct then, and a place for a real hang to hide: a
# server that never bound would have taken fifteen minutes to say so. With migrations
# and seeding moved out, this container imports the app and binds a port, so the honest
# budget is seconds. 180 s is generous for that and still fails fast.
#
# ⚠️ IF SOMETHING EVER GOES BACK INTO `railway-start.sh`, THIS NUMBER IS WRONG AGAIN.
# That is the trade for making it tight, and it is the right way round: a slow start now
# fails the deploy instead of quietly delaying every first request.
healthcheckTimeout = 180
