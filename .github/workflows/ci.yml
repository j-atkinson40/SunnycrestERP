name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_call:

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint + import check
  # ---------------------------------------------------------------------------
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      SECRET_KEY: ci-test-secret-key-not-for-production
      CORS_ORIGINS: '["http://localhost:5173"]'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports (app loads without errors)
        run: python -c "from app.main import app; print('Backend imports OK')"

      # R-3.1.4: heads check runs BEFORE `alembic upgrade head` so it
      # remains actionable even when migration *content* is broken. The
      # heads check reads alembic version files only — it doesn't need
      # a populated DB. Pre-R-3.1.4 this step ran AFTER the upgrade
      # step, which meant a multi-head situation (e.g. R-3.1.2's
      # r48+r88 collision) was swallowed under whatever upgrade error
      # surfaced first. Reordered so multi-heads fail loud at PR time.
      - name: Verify migration heads
        run: |
          HEAD_COUNT=$(alembic heads | wc -l)
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "ERROR: Multiple Alembic heads detected — please merge migrations"
            alembic heads
            echo ""
            echo "Run 'alembic merge -m \"...\" <head1> <head2>' to unify."
            exit 1
          fi
          echo "Single migration head confirmed"

      - name: Run Alembic migrations
        run: alembic upgrade head

      # ⚠️ SEEDS, BETWEEN MIGRATIONS AND PYTEST. Until 2026-09-23 CI went
      # migrations → pytest, so the suite tested against a database shape no
      # deploy ever produces. The environment with the seeds (staging) had no
      # suite; the environments with a suite (CI, local) had no seeds. That gap
      # is why three tests passed for months because `tax_jurisdictions` was
      # EMPTY — a defect no CI run could have seen, because the row could not
      # exist in CI's world at all.
      #
      # ⚠️ COST, AND THE THIRD READING IS THE ONLY ONE TAKEN HERE. ~12s was the
      # first estimate, measured on an already-seeded database — the idempotent
      # path, not the path CI takes. 90s was the second, on a fresh local
      # database. Both were simulations. Measured on this runner 2026-10-01,
      # first real execution: **222s**, 51 seeds attempted, 51 succeeded, 0
      # failed. The step is ~2.5x slower here than on a laptop, and the backend
      # job went 12m54s -> 17m08s.
      #
      # `scripts/seed_dev.sh` is used as-is rather than forked into a CI
      # variant, deliberately: a second copy of the sequence is a second thing
      # to keep in step, and the whole point of this step is that CI and local
      # dev build the SAME database. It already refuses a non-local
      # DATABASE_URL, and CI's is localhost.
      - name: Seed the canonical set
        run: |
          # ⚠️ EPHEMERAL, PER-RUN, AND NEVER PRINTED. seed_sunnycrest generates
          # an admin password when it must CREATE that user, which on CI's
          # always-fresh database is every run. Supplying one means it generates
          # nothing and — since the 2026-09-23 fix — prints nothing either.
          # Generated here so no credential value is ever stored, committed, or
          # passed through a session; the database it belongs to is destroyed
          # with the runner.
          export SUNNYCREST_ADMIN_TEMP_PASSWORD="$(openssl rand -base64 24)"
          export SEED_DEV_LOG="$RUNNER_TEMP/seed-dev.log"
          bash scripts/seed_dev.sh || {
            # ⚠️ FILTERED, NOT TRUSTED. The export above should mean no password
            # line exists, and the next step asserts exactly that — but the next
            # step does not run on this path, and this is the path that prints
            # the log. Relying on the ordering would make the failure branch the
            # one place the guarantee is unchecked. Dropping the line here costs
            # nothing and removes the question.
            echo "::group::seed log (credential lines filtered)"
            grep -v "TEMP admin password for" "$SEED_DEV_LOG"
            echo "::endgroup::"
            exit 1
          }

      # ⚠️ THE LOG IS ONLY SAFE TO PRINT BECAUSE OF THE EXPORT ABOVE, SO CHECK
      # THAT RATHER THAN TRUST IT. Two-sided on purpose: "no password line" is
      # satisfied by a seed that never ran, so the suppression notice is read
      # FIRST and must be present. That notice is printed on the same branch
      # that creates the admin, so it cannot appear unless the credential path
      # actually executed.
      - name: Assert no credential reached the seed log
        run: |
          LOG="$RUNNER_TEMP/seed-dev.log"
          notice=$(grep -c "SUNNYCREST_ADMIN_TEMP_PASSWORD (not printed)" "$LOG" || true)
          leaked=$(grep -c "TEMP admin password for" "$LOG" || true)
          echo "suppression notices: $notice   (positive control, must be >= 1)"
          echo "password lines:      $leaked   (must be 0)"
          if [ "$notice" -lt 1 ]; then
            echo "CONTROL FAILED: the admin-creation branch did not run, so a" >&2
            echo "zero password count proves nothing. Do not read it as clean." >&2
            exit 1
          fi
          if [ "$leaked" -ne 0 ]; then
            echo "A generated credential reached the CI log. Rotate it." >&2
            exit 1
          fi

      # Scoped test gate (S-5). Runs a CURATED set of tests known green
      # against the fresh migrated DB (see tests/ci_gate.txt for the list +
      # why it's scoped, not the whole suite). This is the first pytest that
      # runs in CI at all — it enforces the Accounting Substrate Arc's work
      # and the route-write ratchet. GROW tests/ci_gate.txt as more files are
      # made CI-clean; the full-suite CI-clean effort is a separate arc.
      - name: Install dev/test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run scoped test gate
        # `python -m pytest` (not the bare `pytest` script) so backend/ is on
        # sys.path and the `from tests._cleanup import ...` shared-helper
        # imports resolve.
        run: python -m pytest $(grep -vE '^\s*#|^\s*$' tests/ci_gate.txt | tr '\n' ' ') -q

  # ---------------------------------------------------------------------------
  # Frontend: typecheck + build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -b

      # 4526 tests across 338 files existed and had NEVER run in CI. `tsc -b`
      # above catches type errors; nothing ran the assertions. Two comments in
      # this directory (seed-idempotency.yml, playwright-staging.yml) already
      # described vitest as part of the check — the coverage was documented
      # before it existed.
      - name: Run frontend tests
        run: npm run test:ci

      # ⚠️ A RUN CAN BE GREEN AND HAVE TESTED LESS THAN IT CLAIMS. Measured
      # 2026-10-07: vitest printed `Test Files 338 passed (338)` while SIX FILES
      # NEVER RAN -- `[vitest-pool-runner]: Timeout waiting for worker to respond`
      # -- so the denominator fell from 344 and the summary line still read
      # complete. vitest cannot catch that alone: the six were never counted, so
      # its own collected total was already 338 and ran-against-collected compares
      # 338 to 338. Only a number written down earlier can disagree.
      #
      # ⚠️ `if: always()` IS LOAD-BEARING. Without it this step is skipped exactly
      # when the run also failed for another reason -- which is when a shortfall is
      # most likely and least likely to be noticed.
      - name: Assert the suite did not shrink
        if: always()
        run: npm run test:assert-size

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com

      # ⚠️ THE BUILD ABOVE CANNOT CATCH THE ERROR CLASS THAT FROZE THE DEPLOY, BECAUSE
      # IT RUNS IN THE WRONG CONTEXT. Measured 2026-10-20: two test files imported
      # their data as `../../../../backend/tests/data/...`. CI checks out the WHOLE
      # repo, so the path resolved, `tsc -b` passed and the bundle built — green here,
      # and dead on Railway, whose Dockerfile is `COPY . .` over a context holding only
      # `frontend/`. `npm run build` is `tsc -b && vite build`, so tsc exited 2, vite
      # never ran, NO BUNDLE WAS EMITTED, and the symptom was a deploy sitting at the
      # previous commit with nothing failing anywhere anyone looked.
      #
      # ⚠️ SO THIS STEP BUILDS FROM A COPY CONTAINING ONLY `frontend/`, which is the
      # deploy's own context. `node_modules` is symlinked rather than reinstalled —
      # module RESOLUTION of a path outside the copy does not depend on it, and a
      # second `npm ci` would add minutes for nothing.
      #
      # ⚠️ AND IT CARRIES ITS OWN POSITIVE CONTROL, because a probe that passes for the
      # wrong reason is how this class survives. The control re-introduces a
      # cross-boundary import into the throwaway copy and requires the build to FAIL;
      # a probe that cannot fail would report green over a broken context forever.
      - name: Build in the deploy's own context (frontend only)
        run: |
          set -u
          PROBE="$RUNNER_TEMP/fe-only"
          rm -rf "$PROBE" && mkdir -p "$PROBE"
          cd "$GITHUB_WORKSPACE"
          tar --exclude node_modules --exclude dist -cf - frontend | (cd "$PROBE" && tar -xf -)
          ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$PROBE/frontend/node_modules"
          test ! -d "$PROBE/backend" || { echo "probe context is not frontend-only" >&2; exit 1; }

          echo "::group::build, frontend-only context"
          ( cd "$PROBE/frontend" && npm run build )
          rc=$?
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
            echo "The bundle does not build in Railway's context. A deploy would emit" >&2
            echo "no bundle and sit at the previous commit. Look for an import that" >&2
            echo "reaches outside frontend/." >&2
            exit 1
          fi

          echo "::group::positive control — the probe must be able to fail"
          CTL="$PROBE/frontend/src/__ci_probe_control.ts"
          # ⚠️ A `.json` IMPORT, NOT `?raw`, AND THE DIFFERENCE IS THE WHOLE CONTROL.
          # My first version poisoned the copy with `...opas_requests.jsonl?raw` and the
          # build SUCCEEDED — vite's ambient `declare module '*?raw'` types any such
          # specifier whether the file exists or not, so tsc never resolves the path. A
          # `.json` import goes through `resolveJsonModule` and needs the real file,
          # which is why the deploy-freezing error was `TS2307` on the corpus JSON.
          echo 'import x from "../../backend/tests/data/opas_prefix_corpus.json"' > "$CTL"
          echo 'export default x' >> "$CTL"
          if ( cd "$PROBE/frontend" && npm run build >/dev/null 2>&1 ); then
            echo "::endgroup::"
            echo "CONTROL FAILED: the probe built with a cross-boundary import present," >&2
            echo "so its green result proves nothing. Do not read it as clean." >&2
            exit 1
          fi
          echo "::endgroup::"
          echo "probe discriminates: clean context builds, poisoned context fails"
        env:
          VITE_API_URL: https://api.example.com
